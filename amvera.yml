meta:
  environment: python
  toolchain:
    name: pip
    version: "3.11"

run:
  persistenceMount: /data
  containerPort: 80
  command: |
    python manage.py migrate --noinput &&
    python manage.py collectstatic --noinput &&
    gunicorn config.wsgi:application --bind 0.0.0.0:80

build:
  requirementsPath: requirements.txt
